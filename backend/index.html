<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hansestack Demo Login</title>
  <link rel="shortcut icon" href="https://hansestack.de/favicon.ico" sizes="32x32" />
  <link rel="icon" href="https://hansestack.de/favicon-16x16.png" type="image/png" sizes="16x16" />
  <link rel="icon" href="https://hansestack.de/favicon-32x32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="https://hansestack.de/apple-touch-icon.png" sizes="180x180" />
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f5f7;
    }
    .card {
      width: 360px;
      max-width: 90vw;
      background: #fff;
      color: #111827;
      border-radius: 12px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
      padding: 32px;
    }
    h1 {
      font-size: 1.25rem;
      margin: 0 0 4px;
    }
    p.subtitle {
      margin: 0 0 24px;
      color: #666;
      font-size: 0.9rem;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      background-color: rgb(255, 255, 255);
      color: rgb(51, 65, 85);
      border: 1px solid rgb(209, 213, 219);
      border-radius: 6px;
      padding: 8px 12px;
      margin-bottom: 16px;
      font-family: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji",
        "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
      font-size: 14px;
      font-weight: 400;
      line-height: 20px;
    }
    button {
      width: 100%;
      box-sizing: border-box;
      background-color: rgb(15, 23, 42);
      color: rgb(255, 255, 255);
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      font-family: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji",
        "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
      font-size: 14px;
      font-weight: 500;
      line-height: 20px;
      text-align: center;
      cursor: pointer;
      transition-property: color, background-color, border-color,
        text-decoration-color, fill, stroke;
      transition-duration: 0.15s;
      transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
    }
    button:hover {
      background-color: rgb(30, 41, 59);
    }
    button:disabled {
      background-color: rgb(148, 163, 184);
      cursor: not-allowed;
    }
    .message {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      display: none;
    }
    .message.success {
      background: #dcfce7;
      color: #166534;
      display: block;
    }
    .message.error {
      background: #fee2e2;
      color: #991b1b;
      display: block;
    }
    .message.warning {
      background: #fef9c3;
      color: #854d0e;
      display: block;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .brand .logo {
      height: 24px;
      width: auto;
      max-width: 100%;
    }
    .brand .brand-name {
      color: rgb(0, 0, 0);
      font-family: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji",
        "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
      font-size: 16px;
      font-weight: 800;
      line-height: 24px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="https://hansestack.de/images/logo.png" alt="Hansestack" class="logo" />
      <span class="brand-name">Hansestack Demo Login</span>
    </div>
    <h1>Sign in</h1>
    <p class="subtitle">
      Passwords here are checked for known leaks entirely at the reverse
      proxy layer &mdash; this backend has no idea it's happening.
    </p>

    <form id="login-form">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="demo@example.com" required />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" value="password123" required />

      <button type="submit" id="submit-btn">Log in</button>
    </form>

    <div id="message" class="message"></div>
  </div>

  <script>
    const form = document.getElementById("login-form");
    const messageEl = document.getElementById("message");
    const submitBtn = document.getElementById("submit-btn");

    function showMessage(text, kind) {
      messageEl.textContent = text;
      messageEl.className = "message " + kind;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      submitBtn.disabled = true;
      messageEl.className = "message";

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const res = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });

        // "block" mode rejects a confirmed leak outright with block_status
        // (401 by default). "enrich_response" mode (the default in this
        // demo's Caddyfile) never rejects the request -- it only tags the
        // response with a header, so we check both signals here.
        const leaked = res.headers.get("X-Hansestack-Leaked") === "true";
        const leakCount = res.headers.get("X-Hansestack-Leak-Count");

        if (res.status === 401) {
          showMessage(
            "\u274C Password Leaked \u2014 login blocked by the leak-check proxy.",
            "error"
          );
        } else if (res.status === 201 && leaked) {
          showMessage(
            "\u26A0\uFE0F Login succeeded, but this password was found in " +
              (leakCount ? leakCount + " " : "a ") +
              "known breach (X-Hansestack-Leaked: true).",
            "warning"
          );
        } else if (res.status === 201) {
          showMessage("\u2705 Success \u2014 login accepted.", "success");
        } else {
          showMessage("Unexpected response: HTTP " + res.status, "error");
        }
      } catch (err) {
        showMessage("Request failed: " + err.message, "error");
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
